<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arithmetic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Arithmetic Operator Calculator</h2>

  <input type="number" id="value1" placeholder="Enter Value 1">
  <input type="number" id="value2" placeholder="Enter Value 2">
  <br>

  <button onclick="add()">+</button>
  <button onclick="subtract()">-</button>
  <button onclick="multiply()">*</button>
  <button onclick="divide()">/</button>
  <button onclick="modulus()">%</button>
  <button onclick="incrementValue1()">++ (Value1)</button>
  <button onclick="decrementValue1()">-- (Value1)</button>
  <button onclick="incrementValue2()">++ (Value2)</button>
  <button onclick="decrementValue2()">-- (Value2)</button>


  <div id="result"></div>

  <script src="scripts/arithmetic-operators.js"></script>
</body>
</html>
