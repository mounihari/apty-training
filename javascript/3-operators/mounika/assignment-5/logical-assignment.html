<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Logical Assignment Operators</title>
</head>
<body>
  <h2>Logical Assignment Operators (&&=, ||=, ??=)</h2>

  <label>Value 1: <input type="text" id="value1"></label>
  <label>Type 1:
    <select id="type1">
      <option value="string">string</option>
      <option value="number">number</option>
      <option value="boolean">boolean</option>
      <option value="null">null</option>
      <option value="undefined">undefined</option>
      <option value="object">object</option>
    </select>
  </label>
  <br><br>

  <label>Value 2: <input type="text" id="value2"></label>
  <label>Type 2:
    <select id="type2">
      <option value="string">string</option>
      <option value="number">number</option>
      <option value="boolean">boolean</option>
      <option value="null">null</option>
      <option value="undefined">undefined</option>
      <option value="object">object</option>
    </select>
  </label>
  <br><br>

  <button onclick="logicalAndAssign()">&&=</button>
  <button onclick="logicalOrAssign()">||=</button>
  <button onclick="nullishAssign()">??=</button>

  <div id="result"></div>

  <script src="scripts/logical-assignment.js"></script>
</body>
</html>
