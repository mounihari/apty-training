<!DOCTYPE html>
<html>
<head>
  <title>Custom Object Sort</title>
</head>
<body>
  <h2>Sort Array of Objects by Property</h2>

  <label>Enter array of objects:</label><br>
  <input type="text" id="sortInput" value='[{"name":"Bob","score":80},{"name":"Alice","score":90}]' size="80"><br><br>

  <label>Enter property to sort by (e.g. "score"):</label><br>
  <input type="text" id="propertyInput" value="score"><br><br>

  <button onclick="sortByProperty()">Sort</button>

  <h3>Output:</h3>
  <p id="sortOutput"></p>

  <script src="scripts/custom-array-sorting.js"></script>
</body>
</html>
