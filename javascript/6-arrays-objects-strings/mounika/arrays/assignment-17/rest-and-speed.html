  <title>Combine Arrays Without Duplicates</title>

<body>
  <h2>Combine Two Arrays Without Duplicates</h2>

  <label for="array1">Enter first array (comma-separated):</label><br>
  <input type="text" id="array1" placeholder="e.g. 1,2,3"><br><br>

  <label for="array2">Enter second array (comma-separated):</label><br>
  <input type="text" id="array2" placeholder="e.g. 3,4,5"><br><br>

  <button onclick="combineArrays()">Combine</button>

  <p id="result"></p>

  <script src="scripts/rest-and-speed.js"></script>
