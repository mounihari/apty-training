<!DOCTYPE html>
<html>
<head>
  <title>Transpose Matrix</title>
</head>
<body>
  <h2>Transpose a Matrix</h2>

  <label>Enter matrix rows (comma-separated, each row in a new line):</label><br>
  <textarea id="matrixInput" rows="5" cols="30">1,2,3\n4,5,6\n7,8,9</textarea><br><br>

  <button onclick="transposeMatrix()">Transpose</button>

  <h3>Output:</h3>
  <pre id="matrixOutput"></pre>

  <script src="scripts/multi-dimensional.js"></script>
</body>
</html>
