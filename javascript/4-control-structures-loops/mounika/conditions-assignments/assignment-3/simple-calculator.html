<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Calculator</title>
</head>
<body>
  <h2>Calculator</h2>
  <input type="number" id="value1" placeholder="Enter value 1">
  <input type="number" id="value2" placeholder="Enter value 2">
  <br><br>
  <button data-operator="+">+</button>
  <button data-operator="-">-</button>
  <button data-operator="*">*</button>
  <button data-operator="/">/</button>
  <button data-operator="%">%</button>
  <button data-operator="++">Increment</button>
  <button data-operator="--">Decrement</button>
  <p id="result">Result: </p>

  <script src="scripts/simple-calculator.js"></script>
</body>
</html>
