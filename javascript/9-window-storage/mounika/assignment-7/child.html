<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Window</title>
</head>
<body>
    <h1>Child Window</h1>

    <label for="childMessage">Enter message for parent:</label>
    <input type="text" id="childMessage" placeholder="Message to parent">
    <button id="sendToParent">Send to Parent</button>

    <h3>Messages from Parent:</h3>
    <p id="fromParent">No message yet</p>

    <script src="scripts/child.js"></script>
</body>
</html>
