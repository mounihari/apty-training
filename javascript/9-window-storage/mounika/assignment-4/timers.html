<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timers</title>
</head>
<body>
  <h1>Timers</h1>
  <label>
    Seconds:
    <input id="countdownInput" type="number" min="1" value="10">
  </label>
  <button id="startCountdown">Start Countdown</button>
  <div id="countdownDisplay">00</div>

  <h2>Stopwatch</h2>
  <button id="startStopwatch">Start</button>
  <button id="stopStopwatch">Stop</button>
  <button id="resetStopwatch">Reset</button>
  <div id="stopwatchDisplay">0s</div>

  <script src="scripts/timers.js"></script>
</body>
</html>
