<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scrolling</title>
</head>
<body style="height:2000px; padding:20px;">
  <h1>Scrolling</h1>

  <label>
    X:
    <input id="xInput" type="number" value="0">
  </label>
  <label>
    Y:
    <input id="yInput" type="number" value="0">
  </label>
  <button id="scrollBtn">Scroll To Position</button>

  <br><br>
  <button id="upBtn">Scroll Up 10px</button>
  <button id="downBtn">Scroll Down 10px</button>

  <h3>Current Position</h3>
  <div id="status"></div>

  <script src="scripts/scrolling.js"></script>
</body>
</html>
