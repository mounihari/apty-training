<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce Application</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="container">
    <h1 class="heading">Simple E-Commerce App</h1>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search products">
      <button id="searchBtn">Search</button>
      <button id="allBtn">All Products</button>
      <input type="number" id="idInput" placeholder="Enter Product ID">
      <button id="viewBtn">View Product</button>
    </div>

    <div id="productsContainer"></div>
  </div>

  <script src="scripts/scripts.js"></script>
</body>
</html>
