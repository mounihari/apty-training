<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Higher-Order Function: repeatAction</title>
</head>
<body>
  <div class="container">
    <h2>Repeat Action (Higher-Order Function)</h2>
    <form id="listForm">
      <label for="item">List Item Text:</label>
      <input type="text" id="item" placeholder="e.g. Hello" required />

      <label for="count">How Many Times:</label>
      <input type="number" id="count" min="1" required />

      <button type="submit">Generate List</button>
    </form>

    <ul id="itemList"></ul>
  </div>

  <script src="scripts/higher-order-functions.js"></script>
</body>
</html>
