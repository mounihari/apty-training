<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lexical Scoping Example</title>
</head>
<body>
  <div class="container">
    <h2>Lexical Scoping with Nested Functions</h2>
    <form id="scopeForm">
      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" required />

      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" required />

      <label for="city">City:</label>
      <input type="text" id="city" required />

      <button type="submit">Generate</button>
    </form>

    <p id="output"></p>
  </div>

  <script src="scripts/nested-functions.js"></script>
</body>
</html>
