<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank Account with Closures</title>
</head>
<body>
  <h2>Bank Account</h2>
  <form id="bankForm">
    <label>Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount" required />
    <br><br>
    <button type="button" id="depositBtn">Deposit</button>
    <button type="button" id="withdrawBtn">Withdraw</button>
    <button type="button" id="balanceBtn">Check Balance</button>
  </form>

  <p id="message"></p>

  <script src="scripts/private-variables.js"></script>
</body>
</html>
