<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sort Numbers</title>
</head>
<body>
  <h2>Sort Numbers</h2>
  <form id="sortForm">
    <label>Enter numbers (comma separated):</label><br />
    <input type="text" id="numbers" required placeholder="e.g. 5,3,9,1" />
    <button type="submit">Sort</button>
  </form>

  <table id="resultTable" border="1" style="margin-top: 20px; border-collapse: collapse;">
    <thead>
      <tr><th>Sorted Numbers</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="scripts/sorting.js"></script>
</body>
</html>
