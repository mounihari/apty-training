<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Custom Error Calculator</title>
</head>
<body>
  <div class="container">
    <h2>Custom Error Calculator</h2>
    <form id="calcForm">
      <input type="text" id="num1" placeholder="Enter first number" required />
      <input type="text" id="num2" placeholder="Enter second number" required />
      <select id="operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
      </select>
      <button type="submit">Calculate</button>
    </form>
    <p id="result"></p>
  </div>

  <script src="scripts/custom-errors.js"></script>
</body>
</html>
