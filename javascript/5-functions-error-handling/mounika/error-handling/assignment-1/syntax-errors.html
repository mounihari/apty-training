<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JSON Parser with Error Handling</title>
</head>
<body>
  <div class="container">
    <h2>Safe JSON Parser</h2>
    <form id="jsonForm">
      <label for="jsonInput">Enter JSON String:</label>
      <textarea id="jsonInput" rows="5" placeholder='e.g. {"key": "value"}' required></textarea>
      <button type="submit">Parse</button>
    </form>
    <pre id="output"></pre>
  </div>

  <script src="scripts/syntax-errors.js"></script>
</body>
</html>
