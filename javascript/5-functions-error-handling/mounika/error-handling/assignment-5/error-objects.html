<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Banking Error Handling</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Withdraw Funds</h2>
    <form id="bankForm">
      <input type="number" id="balance" placeholder="Enter Account Balance" required />
      <input type="number" id="withdraw" placeholder="Enter Withdrawal Amount" required />
      <button type="submit">Withdraw</button>
    </form>
    <p id="result"></p>
  </div>
  <script src="scripts/error-objects.js"></script>
</body>
</html>
